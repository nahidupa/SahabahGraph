<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Response Parser Tests - SahabahGraph</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
        }
        h1 {
            color: #2d3748;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #718096;
            margin-bottom: 30px;
        }
        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        .stat-card {
            flex: 1;
            min-width: 150px;
            padding: 20px;
            border-radius: 8px;
            background: #f7fafc;
            border: 2px solid #e2e8f0;
        }
        .stat-card.passed { border-color: #48bb78; background: #f0fff4; }
        .stat-card.failed { border-color: #f56565; background: #fff5f5; }
        .stat-card.total { border-color: #667eea; background: #ebf4ff; }
        .stat-number {
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .stat-label {
            color: #718096;
            font-size: 14px;
        }
        .button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .button:hover { background: #5a67d8; }
        .button:disabled { background: #cbd5e0; cursor: not-allowed; }
        .test-case {
            margin-bottom: 15px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            overflow: hidden;
        }
        .test-case.passed { border-color: #48bb78; }
        .test-case.failed { border-color: #f56565; }
        .test-header {
            padding: 15px;
            background: #f7fafc;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .test-header:hover { background: #edf2f7; }
        .test-icon {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: white;
        }
        .test-icon.passed { background: #48bb78; }
        .test-icon.failed { background: #f56565; }
        .test-title {
            flex: 1;
            font-weight: 600;
            color: #2d3748;
        }
        .test-badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }
        .test-badge.command { background: #bee3f8; color: #2c5282; }
        .test-badge.text { background: #feebc8; color: #7c2d12; }
        .test-details {
            padding: 20px;
            background: white;
            display: none;
            border-top: 1px solid #e2e8f0;
        }
        .test-details.expanded { display: block; }
        .detail-section {
            margin-bottom: 15px;
        }
        .detail-label {
            font-weight: 600;
            color: #4a5568;
            margin-bottom: 5px;
        }
        .code-block {
            background: #2d3748;
            color: #e2e8f0;
            padding: 12px;
            border-radius: 6px;
            font-family: 'Monaco', 'Courier New', monospace;
            font-size: 13px;
            overflow-x: auto;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .comparison {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .expected { border-left: 3px solid #667eea; padding-left: 10px; }
        .actual { border-left: 3px solid #ed8936; padding-left: 10px; }
        .progress {
            height: 4px;
            background: #e2e8f0;
            border-radius: 2px;
            overflow: hidden;
            margin-bottom: 20px;
        }
        .progress-bar {
            height: 100%;
            background: #48bb78;
            transition: width 0.3s;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 AI Response Parser Test Suite</h1>
        <p class="subtitle">Comprehensive testing for AI command parsing and error handling</p>

        <button class="button" id="runButton">▶ Run All Tests</button>

        <div class="progress" id="progress" style="display: none;">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <div class="stats" id="stats" style="display: none;">
            <div class="stat-card total">
                <div class="stat-number" id="totalTests">0</div>
                <div class="stat-label">Total Tests</div>
            </div>
            <div class="stat-card passed">
                <div class="stat-number" id="passedTests">0</div>
                <div class="stat-label">Passed</div>
            </div>
            <div class="stat-card failed">
                <div class="stat-number" id="failedTests">0</div>
                <div class="stat-label">Failed</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="passRate">0%</div>
                <div class="stat-label">Pass Rate</div>
            </div>
        </div>

        <div id="results"></div>
    </div>

    <script>
        // Check if external script loaded
        window.addEventListener('DOMContentLoaded', () => {
            if (typeof runTests === 'undefined' && typeof parseAIResponse === 'undefined') {
                document.getElementById('runButton').disabled = true;
                document.getElementById('runButton').textContent = '❌ Script failed to load';
                document.getElementById('results').innerHTML = `
                    <div style="padding: 20px; background: #fff5f5; border: 2px solid #f56565; border-radius: 8px; color: #c53030;">
                        <strong>Error:</strong> test-parser-implementation.js failed to load.<br><br>
                        Check the browser console for errors (F12 → Console tab)
                    </div>
                `;
            }
        });
    </script>
    <script src="/test-parser-implementation.js"></script>
</body>
</html>
